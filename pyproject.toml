[project]
name = "kedi-summarization-optimizer"
version = "0.1.0"
description = "Offline optimization and certification pipeline for Kedi history summarization."
requires-python = ">=3.11,<3.14"
dependencies = [
    "autobench[pydantic-ai,pydantic-gepa]",
    "codex-auth-helper==1.6.1",
    "pydantic-gepa[integrations]",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3",
    "pytest-cov>=6",
    "ruff>=0.12",
]

[project.scripts]
kedi-summarization-optimize = "kedi_summarization_optimizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kedi_summarization_optimizer"]

[tool.uv.sources]
autobench = { git = "https://github.com/vcoderun/autobench.git", rev = "df61931f4338144130019c45f79fb2bb707d7cc5" }
pydantic-gepa = { git = "https://github.com/vcoderun/pydantic-gepa.git", rev = "a39694b1debd1a33148bb4e1f036662a29ae3848" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
